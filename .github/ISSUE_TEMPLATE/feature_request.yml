name: Idea or correction
description: An idea for the addon, or a fix to a translation.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The idea, or what is wrong and where.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would help with.
